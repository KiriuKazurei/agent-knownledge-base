openapi: 3.1.0
info:
  title: Knowledge Agent Hub API
  version: 2.0.0
  description: |
    Desktop-only Source and KAH knowledge-management API. Agent access is MCP
    Streamable HTTP only: POST /mcp/read for retrieval and POST /mcp/manage for
    validation and draft submission. Those JSON-RPC MCP endpoints are described
    by their MCP tools and resources, not this OpenAPI document.
  contact:
    name: Knowledge Agent Hub maintainers
    url: https://github.com/KiriuKazurei/agent-knownledge-base
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:48761/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Runtime health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /libraries:
    get:
      operationId: listLibraries
      responses:
        '200':
          description: Libraries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Library'}
    post:
      operationId: createLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateLibraryRequest'}
      responses:
        '201':
          description: Created library
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
  /libraries/{libraryId}:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateLibraryRequest'}
      responses:
        '200':
          description: Updated library
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
    delete:
      operationId: deleteLibrary
      responses:
        '204': {description: Moved to Trash; source watches are paused}
  /documents:
    get:
      operationId: listDocuments
      parameters:
        - in: query
          name: libraryId
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Document'}
  /documents/{documentId}:
    get:
      operationId: getDocument
      parameters:
        - in: path
          name: documentId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Document with preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentDetail'}
    patch:
      operationId: updateDocument
      parameters:
        - in: path
          name: documentId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateDocumentRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
    delete:
      operationId: deleteDocument
      parameters:
        - in: path
          name: documentId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Moved to Trash; the document is excluded from retrieval and indexing}
  /plugins/ocr:
    get:
      operationId: getOcrPlugin
      responses:
        '200':
          description: Managed OCR plugin state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrPlugin'}
    patch:
      operationId: setOcrPluginEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200':
          description: Updated OCR plugin state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrPlugin'}
    delete:
      operationId: uninstallOcrPlugin
      responses:
        '200':
          description: OCR resources removed; existing documents preserved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrPlugin'}
  /plugins/ocr/install:
    post:
      operationId: installOcrPlugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string, minLength: 1}
      responses:
        '200':
          description: Local OCR resource package verified and installed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrPlugin'}
        '400': {description: Invalid package or installation failed}
  /ocr/health:
    get:
      operationId: getOcrHealth
      responses:
        '200':
          description: Local OCR resource health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrHealth'}
        '503': {description: OCR worker unavailable}
  /skills:
    get:
      operationId: listSkills
      responses:
        '200':
          description: Installed global Agent Skills
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Skill'}}
  /skills/{skillId}:
    parameters:
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getSkill
      responses:
        '200':
          description: Skill metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Skill'}
    delete:
      operationId: deleteSkill
      responses:
        '204': {description: Deleted}
  /skills/import:
    post:
      operationId: importSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportSkillRequest'}
      responses:
        '202':
          description: Skill import job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
  /skills/{skillId}/links:
    parameters:
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: updateSkillLinks
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SkillLinksRequest'}
      responses:
        '200':
          description: Updated Skill links
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Skill'}
  /skill-mapping-targets:
    get:
      operationId: listSkillMappingTargets
      responses:
        '200':
          description: External Agent or project Skill directories and mappings
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SkillMappingTarget'}}
    post:
      operationId: createSkillMappingTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSkillMappingTargetRequest'}
      responses:
        '201':
          description: Created and verified mapping target
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillMappingTarget'}
  /skill-mapping-targets/{targetId}:
    parameters:
      - in: path
        name: targetId
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateSkillMappingTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSkillMappingTargetRequest'}
      responses:
        '200':
          description: Updated mapping target
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillMappingTarget'}
    delete:
      operationId: deleteSkillMappingTarget
      responses:
        '204': {description: Deleted after safe link cleanup}
  /skill-mapping-targets/{targetId}/skills:
    parameters:
      - in: path
        name: targetId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: addSkillMappings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SkillMappingIDsRequest'}
      responses:
        '200':
          description: Updated mapping target
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillMappingTarget'}
  /skill-mapping-targets/{targetId}/skills/{skillId}:
    parameters:
      - in: path
        name: targetId
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: removeSkillMapping
      responses:
        '204': {description: Removed after safe link cleanup}
  /skill-mapping-targets/{targetId}/skills/{skillId}/record:
    parameters:
      - in: path
        name: targetId
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: forgetSkillMapping
      responses:
        '204': {description: Forgotten without touching the external object}
  /skill-mapping-targets/{targetId}/verify:
    parameters:
      - in: path
        name: targetId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: verifySkillMappingTarget
      responses:
        '200':
          description: Read-only file-system verification result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillMappingTarget'}
  /skill-mapping-targets/{targetId}/skills/{skillId}/repair:
    parameters:
      - in: path
        name: targetId
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: repairSkillMapping
      responses:
        '200':
          description: Updated mapping target after repairing a missing link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillMappingTarget'}
  /skills/{skillId}/manifest:
    parameters:
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getSkillManifest
      responses:
        '200':
          description: Standard Skill package manifest with SKILL.md content
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillManifest'}
  /skills/{skillId}/files/{filePath}:
    parameters:
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: filePath
        required: true
        schema: {type: string}
    get:
      operationId: getSkillFile
      responses:
        '200':
          description: Read-only Skill file
          content:
            application/octet-stream: {}
  /imports/files:
    post:
      operationId: importFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId, paths]
              properties:
                libraryId: {type: string, format: uuid}
                paths: {type: array, items: {type: string}}
                watchSource: {type: boolean, default: false}
      responses:
        '202':
          description: Import jobs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Job'}
  /imports/url:
    post:
      operationId: importUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId, url]
              properties:
                libraryId: {type: string, format: uuid}
                url: {type: string, format: uri}
                maxDepth: {type: integer, minimum: 0, maximum: 3, default: 0}
                maxPages: {type: integer, minimum: 1, maximum: 100, default: 1}
      responses:
        '202':
          description: Import job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
  /jobs:
    get:
      operationId: listJobs
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [queued, running, cancellation_requested, completed, failed, cancelled]}}
        - {in: query, name: kind, schema: {type: string}}
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Job'}
  /jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Queued job cancelled or cooperative cancellation requested}
        '409': {description: Job cannot be cancelled in its current state}
  /jobs/{jobId}/retry:
    post:
      operationId: retryJob
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      responses:
        '202': {description: New job created with originJobId retaining the original record}
        '409': {description: Only failed or cancelled jobs can be retried}
  /folders:
    get:
      operationId: listFolders
      parameters:
        - {in: query, name: libraryId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Virtual folders
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/VirtualFolder'}}
    post:
      operationId: createFolder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFolderRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualFolder'}
  /folders/{folderId}:
    patch:
      operationId: updateFolder
      parameters:
        - {in: path, name: folderId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                parentId: {type: string}
      responses:
        '200': {description: Renamed or moved folder}
        '400': {description: Cross-library parent or hierarchy cycle}
    delete:
      operationId: deleteFolder
      parameters:
        - {in: path, name: folderId, required: true, schema: {type: string}}
      responses:
        '204': {description: Folder removed; document memberships are unassigned but documents are retained}
  /documents/batch:
    post:
      operationId: batchDocuments
      description: Transactional batch operation. Every document must exist and belong to one library, otherwise nothing is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentBatchRequest'}
      responses:
        '200':
          description: Batch applied atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentBatchResult'}
        '400': {description: 'Invalid IDs, cross-library selection, or unsupported action'}
  /documents/{documentId}/reindex:
    post:
      operationId: reindexDocument
      parameters:
        - {in: path, name: documentId, required: true, schema: {type: string, format: uuid}}
      responses:
        '202': {description: Reindex job queued}
  /documents/{documentId}/relink:
    post:
      operationId: relinkDocumentSource
      parameters:
        - {in: path, name: documentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourcePath]
              properties:
                sourcePath: {type: string}
      responses:
        '200': {description: Source relocated and document reparsed}
  /documents/{documentId}/folders/{folderId}:
    put:
      operationId: assignDocumentFolder
      parameters:
        - {in: path, name: documentId, required: true, schema: {type: string}}
        - {in: path, name: folderId, required: true, schema: {type: string}}
      responses:
        '204': {description: Assigned}
    delete:
      operationId: removeDocumentFolder
      parameters:
        - {in: path, name: documentId, required: true, schema: {type: string}}
        - {in: path, name: folderId, required: true, schema: {type: string}}
      responses:
        '204': {description: Removed}
  /sources/watches:
    get:
      operationId: listSourceWatches
      parameters:
        - {in: query, name: libraryId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Source watches
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SourceWatch'}}
    post:
      operationId: createSourceWatch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSourceWatchRequest'}
      responses:
        '202': {description: Scan queued}
  /sources/watches/{watchId}:
    patch:
      operationId: updateSourceWatch
      parameters:
        - {in: path, name: watchId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                recursive: {type: boolean}
      responses:
        '200': {description: Watch pause/recursive settings updated}
    delete:
      operationId: deleteSourceWatch
      parameters:
        - {in: path, name: watchId, required: true, schema: {type: string}}
      responses:
        '204': {description: Deleted}
  /sources/watches/{watchId}/scan:
    post:
      operationId: scanSourceWatch
      parameters:
        - {in: path, name: watchId, required: true, schema: {type: string}}
      responses:
        '202': {description: Scan queued}
  /indexes/rebuild:
    post:
      operationId: rebuildIndex
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RebuildIndexRequest'}
      responses:
        '202': {description: Rebuild queued}
  /saved-searches:
    get:
      operationId: listSavedSearches
      responses:
        '200':
          description: Saved searches
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SavedSearch'}
    post:
      operationId: createSavedSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedSearch'}
      responses:
        '201':
          description: Created saved search
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedSearch'}
  /saved-searches/{savedSearchId}:
    patch:
      operationId: updateSavedSearch
      parameters:
        - in: path
          name: savedSearchId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedSearch'}
      responses:
        '200': {description: 'Full query, view, filters, and sort updated'}
    delete:
      operationId: deleteSavedSearch
      parameters:
        - in: path
          name: savedSearchId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Deleted}

  /graph:
    get:
      operationId: getRelationshipGraph
      parameters:
        - in: query
          name: libraryId
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: workspaceId
          schema: {type: string, format: uuid}
        - in: query
          name: centerNodeId
          schema: {type: string}
        - in: query
          name: depth
          schema: {type: integer, minimum: 1, maximum: 2, default: 1}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 300, default: 250}
      responses:
        '200':
          description: Stable knowledge relationship graph scoped to one library
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphSnapshot'}
  /graph/workspaces:
    post:
      operationId: createGraphWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId]
              properties:
                libraryId: {type: string, format: uuid}
                name: {type: string, maxLength: 120, default: 默认图谱}
      responses:
        '201':
          description: Created graph workspace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphWorkspace'}
  /graph/workspaces/{workspaceId}:
    parameters:
      - in: path
        name: workspaceId
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateGraphWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateGraphWorkspaceRequest'}
      responses:
        '200':
          description: Updated graph workspace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphWorkspace'}
  /graph/workspaces/{workspaceId}/positions:
    parameters:
      - in: path
        name: workspaceId
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: saveGraphPositions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positions]
              properties:
                positions:
                  type: array
                  maxItems: 300
                  items: {$ref: '#/components/schemas/GraphPositionUpdate'}
      responses:
        '200':
          description: Atomically saved normalized fractional percentage positions
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items: {$ref: '#/components/schemas/GraphPositionUpdate'}
  /graph/workspaces/{workspaceId}/auto-layout:
    parameters:
      - in: path
        name: workspaceId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: autoLayoutGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId]
              properties:
                libraryId: {type: string, format: uuid}
                overwrite: {type: boolean, default: false}
      responses:
        '200':
          description: Deterministic percentage positions for missing or all visible nodes
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items: {$ref: '#/components/schemas/GraphPositionUpdate'}

  /knowledge/search:
    post:
      operationId: searchKnowledge
      description: Desktop-only KAH directory search. Agents must use knowledge_search through Read MCP.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeSearchRequest'}
      responses:
        '200':
          description: Relevant stable knowledge directory entries, without full body text.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeSearchResponse'}
  /knowledge/resolve:
    get:
      operationId: resolveKnowledge
      parameters:
        - in: query
          name: uri
          required: true
          schema: {type: string, format: uri}
      responses:
        '200':
          description: A stable or explicitly revision-pinned KAH knowledge payload.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Knowledge'}
  /knowledge/submissions:
    get:
      operationId: listKAHKnowledgeSubmissions
      parameters:
        - in: query
          name: libraryId
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: KAH draft submissions visible to the desktop session.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/KAHSubmission'}}
    post:
      operationId: createDesktopKnowledgeSubmission
      description: Creates an immutable revision draft from the current stable revision. A stale baseRevision returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DesktopKnowledgeSubmissionRequest'}
      responses:
        '201': {description: Revision draft created}
        '409': {description: Stable base revision changed or client idempotency ID conflicts}
  /knowledge/submissions/{submissionId}:
    parameters:
      - in: path
        name: submissionId
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getKAHKnowledgeSubmission
      responses:
        '200':
          description: KAH submission, validation outcome, review history, and normalized Markdown.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KAHSubmission'}
  /knowledge/submissions/{submissionId}/approve:
    post:
      operationId: approveKAHKnowledgeSubmission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecisionRequest'}
      responses:
        '200':
          description: Approved and atomically published KAH revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Knowledge'}
  /knowledge/submissions/{submissionId}/reject:
    post:
      operationId: rejectKAHKnowledgeSubmission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecisionRequest'}
      responses:
        '200':
          description: Submission rejected and retained for audit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KAHSubmission'}

  /tokens:
    get:
      operationId: listTokens
      responses:
        '200':
          description: Agent tokens
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AgentToken'} }
    post:
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: {type: string}
                scopes: {type: array, minItems: 1, items: {enum: [mcp_read, mcp_manage]}}
                libraryIds: {type: array, items: {type: string, format: uuid}}
      responses:
        '201':
          description: Token, including the one-time plaintext secret
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToken'}
  /providers:
    get:
      operationId: listProviders
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Provider'} }
    post:
      operationId: saveProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Provider'}
      responses:
        '200':
          description: Saved provider
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provider'}
  /providers/{providerId}/models:
    get:
      operationId: listProviderModels
      parameters:
        - in: path
          name: providerId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Available provider models
          content:
            application/json:
              schema: {type: object, required: [models], properties: {models: {type: array, items: {type: string}}}}
  /providers/{providerId}:
    delete:
      operationId: deleteProvider
      parameters:
        - {in: path, name: providerId, required: true, schema: {type: string}}
      responses:
        '204': {description: Provider deleted}
        '409': {description: Provider is referenced by one or more library automation settings}
  /providers/{providerId}/test:
    post:
      operationId: testProvider
      parameters:
        - {in: path, name: providerId, required: true, schema: {type: string}}
      responses:
        '200': {description: Connection succeeded and available models returned}
  /trash:
    get:
      operationId: listTrash
      responses:
        '200': {description: Trashed libraries and documents}
    delete:
      operationId: emptyTrash
      responses:
        '204': {description: All trashed records and unreferenced object files permanently removed}
  /trash/{kind}/{id}/restore:
    post:
      operationId: restoreTrashItem
      parameters:
        - {in: path, name: kind, required: true, schema: {enum: [library, document]}}
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Restored; library source watches remain paused}
  /trash/{kind}/{id}:
    delete:
      operationId: purgeTrashItem
      parameters:
        - {in: path, name: kind, required: true, schema: {enum: [library, document]}}
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Permanently removed after object reference check}
  /audit:
    get:
      operationId: listAudit
      responses:
        '200':
          description: Recent local audit entries
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}
  /backups:
    get:
      operationId: listBackups
      responses:
        '200':
          description: Existing local backup artifacts, newest first
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/BackupRecord'}}
    post:
      operationId: createBackup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                includeIndexes: {type: boolean, default: true}
      responses:
        '201':
          description: Backup artifact
          content:
            application/json:
              schema: {type: object, properties: {path: {type: string}, sha256: {type: string}}}
  /backups/verify:
    post:
      operationId: verifyBackup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string}
      responses:
        '200': {description: Backup checksum and manifest are valid}
        '400': {description: 'Backup is missing, corrupt, or incompatible'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    Health:
      type: object
      required: [status, version, worker]
      properties:
        status: {const: ok}
        version: {type: string}
        worker: {type: string}
    OcrPlugin:
      type: object
      required: [id, name, installed, enabled, version, sizeBytes]
      properties:
        id: {type: string, enum: [ocr]}
        name: {type: string}
        installed: {type: boolean}
        enabled: {type: boolean}
        version: {type: string}
        sizeBytes: {type: integer, minimum: 0}
    OcrHealth:
      type: object
      required: [available, code]
      properties:
        available: {type: boolean}
        resourcesVerified: {type: boolean}
        engineReady: {type: boolean}
        code: {type: string}
        message: {type: string}
        schema: {type: string}
        version: {type: string}
        fileCount: {type: integer, minimum: 0}
    Library:
      type: object
      required: [id, name, icon, color, tags, favorite, allowRemoteModels, autoSummarizeImports, importConversionMode, autoReviewAgentSubmissions, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        icon: {type: string, enum: [library, book-open, bot, folder, sparkles, database, archive, tag]}
        color: {type: string, enum: [jade, blue, amber, violet, rose, slate]}
        tags: {type: array, items: {type: string, maxLength: 60}, maxItems: 30}
        favorite: {type: boolean}
        allowRemoteModels: {type: boolean}
        autoSummarizeImports: {type: boolean}
        importConversionMode: {type: string, enum: [reference, enhanced, off]}
        summaryProviderId: {type: string, format: uuid}
        autoReviewAgentSubmissions: {type: boolean}
        reviewProviderId: {type: string, format: uuid}
        deletedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateLibraryRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 1000}
    UpdateLibraryRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 1000}
        icon: {type: string, enum: [library, book-open, bot, folder, sparkles, database, archive, tag]}
        color: {type: string, enum: [jade, blue, amber, violet, rose, slate]}
        tags: {type: array, items: {type: string, maxLength: 60}, maxItems: 30}
        favorite: {type: boolean}
        allowRemoteModels: {type: boolean}
        autoSummarizeImports: {type: boolean}
        importConversionMode: {type: string, enum: [reference, enhanced, off]}
        summaryProviderId: {type: string, format: uuid}
        autoReviewAgentSubmissions: {type: boolean}
        reviewProviderId: {type: string, format: uuid}
    Document:
      type: object
      required: [id, libraryId, title, mediaType, status, favorite, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        libraryId: {type: string, format: uuid}
        title: {type: string}
        mediaType: {type: string}
        sourcePath: {type: string}
        sourceUrl: {type: string, format: uri}
        objectPath: {type: string}
        contentHash: {type: string}
        status: {enum: [pending, pending_review, approved_pending_index, rejected, ready, failed, source_missing]}
        error: {type: string}
        tags: {type: array, items: {type: string}}
        folderIds: {type: array, items: {type: string}}
        favorite: {type: boolean}
        deletedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DocumentDetail:
      allOf:
        - {$ref: '#/components/schemas/Document'}
        - type: object
          properties:
            preview: {type: array, items: {$ref: '#/components/schemas/Chunk'}}
    UpdateDocumentRequest:
      type: object
      properties:
        title: {type: string}
        tags: {type: array, items: {type: string}}
        content: {type: string, description: Editable only for text and Markdown documents}
        favorite: {type: boolean}
    Chunk:
      type: object
      required: [id, documentId, text, location, contentHash]
      properties:
        id: {type: string}
        documentId: {type: string, format: uuid}
        text: {type: string}
        location: {type: object, additionalProperties: true}
        contentHash: {type: string}
    KnowledgeSearchRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 8000}
        libraryIds: {type: array, items: {type: string, format: uuid}}
        types: {type: array, items: {enum: [concept, claim, procedure, decision, policy, reference]}}
        language: {enum: [zh-CN, en]}
        classifications: {type: object, additionalProperties: {type: array, items: {type: string}}}
        tags: {type: array, items: {type: string}}
        statuses: {type: array, items: {enum: [stable]}, description: The directory currently exposes only the current stable revision of each knowledge item.}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
        cursor: {type: string}
    GraphPosition:
      type: object
      required: [xPct, yPct]
      properties:
        xPct: {type: number, minimum: 0, maximum: 100, description: Decimal percentage normalized to three fractional digits by the server.}
        yPct: {type: number, minimum: 0, maximum: 100, description: Decimal percentage normalized to three fractional digits by the server.}
    GraphPositionUpdate:
      allOf:
        - $ref: '#/components/schemas/GraphPosition'
        - type: object
          required: [nodeId]
          properties:
            nodeId: {type: string, minLength: 1}
    GraphWorkspace:
      type: object
      required: [id, libraryId, name, filters, viewport, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        libraryId: {type: string, format: uuid}
        name: {type: string}
        filters: {type: object, additionalProperties: true}
        viewport: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UpdateGraphWorkspaceRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        filters: {type: object, additionalProperties: true}
        viewport: {type: object, additionalProperties: true}
    GraphNode:
      type: object
      required: [id, kind, label, uri, tags, position]
      properties:
        id: {type: string}
        kind: {type: string, enum: [knowledge, document, external_source, tag_cluster]}
        label: {type: string}
        description: {type: string}
        uri: {type: string}
        revision: {type: integer, minimum: 1}
        status: {type: string}
        trust: {type: string}
        tags: {type: array, items: {type: string}}
        position:
          anyOf:
            - $ref: '#/components/schemas/GraphPosition'
            - type: 'null'
    GraphEdge:
      type: object
      required: [id, kind, relationType, source, target]
      properties:
        id: {type: string}
        kind: {type: string, enum: [relation, source, derivation, cluster]}
        relationType: {type: string}
        source: {type: string}
        target: {type: string}
        targetRevision: {type: integer, minimum: 1}
        sourceId: {type: string}
        locator: {type: object, additionalProperties: true}
        snapshot: {type: object, additionalProperties: true}
    GraphSnapshot:
      type: object
      required: [workspace, nodes, edges, truncated, hiddenNodeCount, limits]
      properties:
        workspace: {$ref: '#/components/schemas/GraphWorkspace'}
        nodes: {type: array, items: {$ref: '#/components/schemas/GraphNode'}}
        edges: {type: array, items: {$ref: '#/components/schemas/GraphEdge'}}
        truncated: {type: boolean}
        hiddenNodeCount: {type: integer, minimum: 0}
        limits:
          type: object
          required: [requestedDepth, appliedDepth, maxNodes]
          properties:
            requestedDepth: {type: integer, minimum: 1}
            appliedDepth: {type: integer, minimum: 1, maximum: 2}
            maxNodes: {type: integer, minimum: 1, maximum: 300}
    KnowledgeDirectoryEntry:
      type: object
      required: [uri, revision, title, description, type, language, primaryPath, tags, matchedSectionIds, matchReason, flags, trust]
      properties:
        uri: {type: string, format: uri}
        revision: {type: integer, minimum: 1}
        title: {type: string}
        description: {type: string}
        type: {enum: [concept, claim, procedure, decision, policy, reference]}
        subtype: {type: string}
        language: {enum: [zh-CN, en]}
        primaryPath: {type: array, items: {type: string}}
        classifications: {type: object, additionalProperties: {type: array, items: {type: string}}}
        tags: {type: array, items: {type: string}}
        matchedSectionIds: {type: array, items: {type: string}}
        matchReason: {type: string}
        flags: {type: array, items: {type: string}}
        trust: {type: string}
        conflictUris: {type: array, items: {type: string, format: uri}}
    KnowledgeSearchResponse:
      type: object
      required: [results]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/KnowledgeDirectoryEntry'}}
        nextCursor: {type: string}
    Knowledge:
      type: object
      required: [libraryId, knowledgeId, uri, revision, payload, markdown, contentHash, status, flags, stable, createdAt]
      properties:
        libraryId: {type: string, format: uuid}
        knowledgeId: {type: string, format: uuid}
        uri: {type: string, format: uri}
        revision: {type: integer, minimum: 1}
        payload: {type: object, additionalProperties: true, description: Canonical kah-knowledge/v1 JSON payload.}
        markdown: {type: string, description: Generated OKF-style YAML frontmatter and Markdown export.}
        contentHash: {type: string}
        status: {enum: [draft, approved_pending_index, stable, deprecated, rejected]}
        flags: {type: array, items: {type: string, enum: [stale, disputed, source-unverified, external-untrusted]}}
        stable: {type: boolean}
        createdAt: {type: string, format: date-time}
        submittedBy: {type: string}
    KAHSubmission:
      type: object
      required: [id, libraryId, knowledgeUri, revision, mode, reviewStatus, validation, title, summary, tags, provenance, clientSubmissionId, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        libraryId: {type: string, format: uuid}
        knowledgeUri: {type: string, format: uri}
        revision: {type: integer, minimum: 1}
        mode: {enum: [create, propose_revision]}
        reviewStatus: {enum: [pending_review, approved_pending_index, rejected, published]}
        validation: {type: object, additionalProperties: true}
        title: {type: string}
        summary: {type: string}
        tags: {type: array, items: {type: string}}
        provenance: {type: object, additionalProperties: true}
        markdown: {type: string}
        reviews: {type: array, items: {$ref: '#/components/schemas/KAHReviewRecord'}}
        submittedByTokenId: {type: string, format: uuid}
        clientSubmissionId: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    KAHReviewRecord:
      type: object
      required: [id, submissionId, reviewerType, reviewer, decision, reason, createdAt]
      properties:
        id: {type: string, format: uuid}
        submissionId: {type: string, format: uuid}
        reviewerType: {enum: [human, model]}
        reviewer: {type: string}
        decision: {enum: [approve, reject, needs_human]}
        reason: {type: string}
        createdAt: {type: string, format: date-time}
    Skill:
      type: object
      required: [id, name, description, rootPath, entryPoint, contentHash, status, fileCount, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 64}
        description: {type: string, maxLength: 1024}
        compatibility: {type: string, maxLength: 500}
        license: {type: string}
        metadata: {type: object, additionalProperties: {type: string}}
        allowedTools: {type: string}
        rootPath: {type: string}
        entryPoint: {type: string, const: SKILL.md}
        contentHash: {type: string}
        status: {enum: [ready, failed, invalid]}
        error: {type: string}
        systemRole: {type: string}
        fileCount: {type: integer, minimum: 0}
        usesLibraryIds: {type: array, items: {type: string, format: uuid}}
        requiresLibraryIds: {type: array, items: {type: string, format: uuid}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ImportSkillRequest:
      type: object
      required: [path]
      properties:
        path: {type: string}
        replace: {type: boolean, default: false}
    SkillLinksRequest:
      type: object
      properties:
        usesLibraryIds: {type: array, items: {type: string, format: uuid}}
        requiresLibraryIds: {type: array, items: {type: string, format: uuid}}
    SkillMappingTarget:
      type: object
      required: [id, name, kind, directoryPath, status, mappings, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {enum: [agent, project]}
        directoryPath: {type: string, description: Normalized absolute Windows directory path}
        status: {enum: [pending, ready, partial, missing, conflict, invalid, permission_required]}
        error: {type: string}
        mappings: {type: array, items: {$ref: '#/components/schemas/SkillMapping'}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastVerifiedAt: {type: string, format: date-time}
    SkillMapping:
      type: object
      required: [targetId, skillId, skillName, sourcePath, linkName, linkPath, status, createdAt, updatedAt]
      properties:
        targetId: {type: string, format: uuid}
        skillId: {type: string, format: uuid}
        skillName: {type: string}
        sourcePath: {type: string}
        linkName: {type: string}
        linkPath: {type: string}
        status: {enum: [pending, ready, missing, conflict, permission_required, invalid]}
        error: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastVerifiedAt: {type: string, format: date-time}
    CreateSkillMappingTargetRequest:
      type: object
      required: [name, kind, directoryPath]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {enum: [agent, project]}
        directoryPath: {type: string, description: Existing absolute Windows directory path}
        skillIds: {type: array, items: {type: string, format: uuid}, uniqueItems: true}
    UpdateSkillMappingTargetRequest:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {enum: [agent, project]}
    SkillMappingIDsRequest:
      type: object
      required: [skillIds]
      properties:
        skillIds: {type: array, minItems: 1, items: {type: string, format: uuid}, uniqueItems: true}
    SavedSearch:
      type: object
      required: [id, name, query, view, libraryIds, tags, filters, sort]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        query: {type: string, minLength: 1, maxLength: 8000}
        view: {enum: [sources, knowledge]}
        libraryIds: {type: array, items: {type: string, format: uuid}}
        tags: {type: array, items: {type: string}}
        filters:
          type: object
          required: [tags, tagMode, favorite]
          properties:
            tags: {type: array, items: {type: string}}
            tagMode: {enum: [all, any]}
            favorite: {type: boolean}
            folderIds: {type: array, items: {type: string, format: uuid}}
            statuses: {type: array, items: {type: string}}
            mediaTypes: {type: array, items: {type: string}}
            sourceKinds: {type: array, items: {type: string}}
            favoritesOnly: {type: boolean, deprecated: true}
        sort:
          type: object
          required: [field, direction]
          properties:
            field: {type: string}
            direction: {enum: [asc, desc]}
    VirtualFolder:
      type: object
      required: [id, libraryId, name, createdAt, updatedAt]
      properties:
        id: {type: string}
        libraryId: {type: string}
        name: {type: string}
        parentId: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateFolderRequest:
      type: object
      required: [libraryId, name]
      properties:
        libraryId: {type: string}
        name: {type: string, minLength: 1, maxLength: 120}
        parentId: {type: string}
    SourceWatch:
      type: object
      required: [id, libraryId, rootPath, recursive, enabled]
      properties:
        id: {type: string}
        libraryId: {type: string}
        rootPath: {type: string}
        recursive: {type: boolean}
        enabled: {type: boolean}
        lastScanAt: {type: string, format: date-time}
        lastMessage: {type: string}
    CreateSourceWatchRequest:
      type: object
      required: [libraryId, rootPath]
      properties:
        libraryId: {type: string}
        rootPath: {type: string}
        recursive: {type: boolean, default: true}
    RebuildIndexRequest:
      type: object
      required: [libraryId]
      properties:
        libraryId: {type: string}
    SkillFile:
      type: object
      required: [path, size, sha256, mediaType]
      properties:
        path: {type: string}
        size: {type: integer, minimum: 0}
        sha256: {type: string}
        mediaType: {type: string}
        url: {type: string}
        content: {type: string}
    SkillManifest:
      type: object
      required: [skill, root, entryPoint, files]
      properties:
        skill: {$ref: '#/components/schemas/Skill'}
        root: {type: string}
        entryPoint: {$ref: '#/components/schemas/SkillFile'}
        files: {type: array, items: {$ref: '#/components/schemas/SkillFile'}}
    Job:
      type: object
      required: [id, kind, status, progress, canCancel, canRetry, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        status: {enum: [queued, running, cancellation_requested, completed, failed, cancelled]}
        progress: {type: number, minimum: 0, maximum: 1}
        message: {type: string}
        stage: {type: string, description: Current durable processing stage}
        outcome: {type: string, enum: [completed, failed, cancelled, degraded, needs_review, reference_ready, enhanced_ready]}
        completedUnits: {type: integer, minimum: 0}
        totalUnits: {type: integer, minimum: 0}
        errorCode: {type: string}
        originJobId: {type: string, format: uuid}
        canCancel: {type: boolean}
        canRetry: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DocumentBatchRequest:
      type: object
      required: [documentIds, action]
      properties:
        documentIds: {type: array, minItems: 1, maxItems: 1000, uniqueItems: true, items: {type: string, format: uuid}}
        action: {enum: [favorite, add_tags, remove_tags, add_folders, remove_folders, trash, reindex]}
        tags: {type: array, items: {type: string}}
        folderIds: {type: array, items: {type: string}}
        favorite: {type: boolean}
    DocumentBatchResult:
      type: object
      required: [libraryId, documentIds, updatedCount]
      properties:
        libraryId: {type: string, format: uuid}
        documentIds: {type: array, items: {type: string, format: uuid}}
        updatedCount: {type: integer, minimum: 0}
        jobIds: {type: array, items: {type: string, format: uuid}}
    DesktopKnowledgeSubmissionRequest:
      type: object
      required: [libraryId, mode, knowledgeUri, baseRevision, clientSubmissionId, payload]
      properties:
        libraryId: {type: string, format: uuid}
        mode: {enum: [create, propose_revision]}
        knowledgeUri: {type: string, format: uri}
        baseRevision: {type: integer, minimum: 0}
        clientSubmissionId: {type: string, minLength: 1}
        payload: {type: object, additionalProperties: true}
    BackupRecord:
      type: object
      required: [path, size, createdAt]
      properties:
        path: {type: string}
