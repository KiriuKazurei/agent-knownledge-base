        keywordOnly: {type: boolean}
        modelId: {type: string}
        modelVersion: {type: string}
        configHash: {type: string}
        dimension: {type: integer, minimum: 0}
        corpusComplete: {type: boolean}
        needsRebuild: {type: boolean}
        retrievalMode: {enum: [lexical, vector, hybrid]}
        degraded: {type: boolean}
        degradedReason: {type: string}
    RetrievalChunk:
      type: object
      required: [id, text, sourceType, reviewStatus, libraryId, contentHash]
      properties:
        id: {type: string}
        documentId: {type: string}
        text: {type: string, minLength: 1}
        sourceType: {enum: [knowledge, raw, architecture]}
        reviewStatus: {enum: [stable, unreviewed, derived, deprecated]}
        libraryId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        sourceURI: {type: string}
        title: {type: string}
        filePath: {type: string}
        lineStart: {type: integer, minimum: 0}
        lineEnd: {type: integer, minimum: 0}
        contentHash: {type: string, pattern: '^[A-Fa-f0-9]{64}$'}
        symbol: {type: string}
        language: {type: string}
        permissionScope: {enum: [library, project]}
        location: {type: object, additionalProperties: true}
        tokenCount: {type: integer, minimum: 0}
        tokenLimit: {type: integer, minimum: 0}
        truncated: {type: boolean}
    RetrievalFilters:
      type: object
      properties:
        sourceType: {enum: [all, knowledge, raw, architecture], default: all}
        sourceTypes: {type: array, uniqueItems: true, items: {enum: [knowledge, raw, architecture]}}
        reviewStatuses: {type: array, uniqueItems: true, items: {enum: [stable, unreviewed, derived, deprecated]}}
        libraryIds: {type: array, items: {type: string, format: uuid}}
        projectIds: {type: array, items: {type: string, format: uuid}}
        allowRaw: {type: boolean, description: Server-controlled for desktop; never grants an Agent token new scope}
    RetrievalSearchRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 8000}
        filters: {$ref: '#/components/schemas/RetrievalFilters'}
        topK: {type: integer, minimum: 1, maximum: 100, default: 10}
        retrievalMode: {enum: [lexical, vector, hybrid], default: hybrid}
    RetrievalResult:
      allOf:
        - {$ref: '#/components/schemas/RetrievalChunk'}
        - type: object
          required: [scores]
          properties:
            scores:
              type: object
              required: [lexical, vector, fusion, final]
              properties:
                lexical: {type: number}
                vector: {type: number}
                fusion: {type: number}
                final: {type: number}
                symbolMatch: {type: boolean}
    RetrievalSearchResponse:
      type: object
      required: [results, semanticAvailable, keywordOnly, degraded, retrievalMode]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/RetrievalResult'}}
        source: {type: string}
        generation: {type: string}
        semanticAvailable: {type: boolean}
        keywordOnly: {type: boolean}
        degraded: {type: boolean}
        degradedReason: {type: string}
        modelId: {type: string}
        modelVersion: {type: string}
        configHash: {type: string}
        dimension: {type: integer, minimum: 0}
        corpusComplete: {type: boolean}
        needsRebuild: {type: boolean}
        retrievalMode: {enum: [lexical, vector, hybrid]}
    RetrievalGeneration:
      type: object
      required: [libraryId, generation, semanticAvailable]
      properties:
        libraryId: {type: string, format: uuid}
        generation: {type: string}
        status: {type: string}
        count: {type: integer, minimum: 0}
        semanticAvailable: {type: boolean}
        keywordOnly: {type: boolean}
        degraded: {type: boolean}
        degradedReason: {type: string}
        modelId: {type: string}
        modelVersion: {type: string}
        configHash: {type: string}
        dimension: {type: integer, minimum: 0}
        corpusComplete: {type: boolean}
        needsRebuild: {type: boolean}
    RetrievalProgress:
      type: object
      required: [libraryId, status, completed, total]
      properties:
        libraryId: {type: string, format: uuid}
        generation: {type: string}
        status: {type: string, enum: [idle, running, completed, failed, cancelled, cancellation_requested, unknown]}
        completed: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        error: {type: string}
    RetrievalRebuildRequest:
      type: object
      properties:
        libraryIds: {type: array, items: {type: string, format: uuid}}
        modelId: {type: string}
    SkillFile:
      type: object
      required: [path, size, sha256, mediaType]
      properties:
        path: {type: string}
        size: {type: integer, minimum: 0}
        sha256: {type: string}
        mediaType: {type: string}
        url: {type: string}
        content: {type: string}
    SkillManifest:
      type: object
      required: [skill, root, entryPoint, files]
      properties:
        skill: {$ref: '#/components/schemas/Skill'}
        root: {type: string}
        entryPoint: {$ref: '#/components/schemas/SkillFile'}
        files: {type: array, items: {$ref: '#/components/schemas/SkillFile'}}
    Job:
      type: object
      required: [id, kind, status, progress, canCancel, canRetry, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        status: {enum: [queued, running, cancellation_requested, completed, failed, cancelled]}
        progress: {type: number, minimum: 0, maximum: 1}
        message: {type: string}
        stage: {type: string, description: Current durable processing stage}
        outcome: {type: string, enum: [completed, failed, cancelled, degraded, needs_review, reference_ready, enhanced_ready]}
        completedUnits: {type: integer, minimum: 0}
        totalUnits: {type: integer, minimum: 0}
        errorCode: {type: string}
        originJobId: {type: string, format: uuid}
        canCancel: {type: boolean}
        canRetry: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DocumentBatchRequest:
      type: object
      required: [documentIds, action]
      properties:
        documentIds: {type: array, minItems: 1, maxItems: 1000, uniqueItems: true, items: {type: string, format: uuid}}
        action: {enum: [favorite, add_tags, remove_tags, add_folders, remove_folders, trash, reindex]}
        tags: {type: array, items: {type: string}}
        folderIds: {type: array, items: {type: string}}
        favorite: {type: boolean}
    DocumentBatchResult:
      type: object
      required: [libraryId, documentIds, updatedCount]
      properties:
        libraryId: {type: string, format: uuid}
        documentIds: {type: array, items: {type: string, format: uuid}}
        updatedCount: {type: integer, minimum: 0}
        jobIds: {type: array, items: {type: string, format: uuid}}
    DesktopKnowledgeSubmissionRequest:
      type: object
      required: [libraryId, mode, knowledgeUri, baseRevision, clientSubmissionId, payload]
      properties:
        libraryId: {type: string, format: uuid}
        mode: {enum: [create, propose_revision]}
        knowledgeUri: {type: string, format: uri}
        baseRevision: {type: integer, minimum: 0}
        clientSubmissionId: {type: string, minLength: 1}
        payload: {type: object, additionalProperties: true}
    BackupRecord:
      type: object
      required: [path, size, createdAt]
      properties:
        path: {type: string}
        size: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    ReviewDecisionRequest:
      type: object
      properties:
        reason: {type: string, maxLength: 2000}
    AgentToken:
      type: object
      required: [id, name, scopes, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        scopes: {type: array, minItems: 1, uniqueItems: true, items: {type: string, enum: [mcp_read, mcp_manage, evidence_search, evidence_read]}}
        libraryIds: {type: array, items: {type: string}}
        projectIds: {type: array, items: {type: string}, description: Explicit architecture-project grants}
        secret: {type: string, description: Returned once at creation}
        createdAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    AuditEntry:
      type: object
      required: [id, actor, action, target, details, createdAt]
      properties:
        id: {type: string}
        actor: {type: string}
        action: {type: string}
        target: {type: string}
        details: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}
    Provider:
      type: object
      required: [id, name, kind, baseUrl, local]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {enum: [openai, anthropic, lmstudio, custom]}
        baseUrl: {type: string, format: uri}
        model: {type: string}
        embeddingModel: {type: string}
        local: {type: boolean}
        apiKey: {type: string, writeOnly: true}
