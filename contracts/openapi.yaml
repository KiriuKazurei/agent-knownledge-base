openapi: 3.1.0
info:
  title: Knowledge Agent Hub API
  version: 2.0.0
  description: |
    Desktop-only Source and KAH knowledge-management API. Agent access is MCP
    Streamable HTTP only: POST /mcp/read for retrieval and POST /mcp/manage for
    validation and draft submission. The read server exposes knowledge_search,
    evidence_search, and evidence_read; evidence scopes are explicit token
    grants and always require mcp_read.
  contact:
    name: Knowledge Agent Hub maintainers
    url: https://github.com/KiriuKazurei/agent-knownledge-base
  license:
    name: MIT
servers:
  - url: http://127.0.0.1:48761/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Runtime health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /libraries:
    get:
      operationId: listLibraries
      responses:
        '200':
          description: Libraries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Library'}
    post:
      operationId: createLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateLibraryRequest'}
      responses:
        '201':
          description: Created library
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
  /libraries/{libraryId}:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateLibraryRequest'}
      responses:
        '200':
          description: Updated library
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Library'}
    delete:
      operationId: deleteLibrary
      responses:
        '204': {description: Moved to Trash; source watches are paused}
  /documents:
    get:
      operationId: listDocuments
      parameters:
        - in: query
          name: libraryId
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Document'}
  /documents/{documentId}:
    get:
      operationId: getDocument
      parameters:
        - in: path
          name: documentId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Document with preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentDetail'}
    patch:
      operationId: updateDocument
      parameters:
        - in: path
          name: documentId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateDocumentRequest'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
    delete:
      operationId: deleteDocument
      parameters:
        - in: path
          name: documentId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Moved to Trash; the document is excluded from retrieval and indexing}
  /plugins/ocr:
    get:
      operationId: getOcrPlugin
      responses:
        '200':
          description: Managed OCR plugin state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrPlugin'}
    patch:
      operationId: setOcrPluginEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200':
          description: Updated OCR plugin state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrPlugin'}
    delete:
      operationId: uninstallOcrPlugin
      responses:
        '200':
          description: OCR resources removed; existing documents preserved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrPlugin'}
  /plugins/ocr/install:
    post:
      operationId: installOcrPlugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string, minLength: 1}
      responses:
        '200':
          description: Local OCR resource package verified and installed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrPlugin'}
        '400': {description: Invalid package or installation failed}
  /ocr/health:
    get:
      operationId: getOcrHealth
      responses:
        '200':
          description: Local OCR resource health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OcrHealth'}
        '503': {description: OCR worker unavailable}
  /embedding-models:
    get:
      operationId: listEmbeddingModels
      responses:
        '200':
          description: Installed and fixed-catalog local embedding models
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmbeddingModelList'}
        '503': {description: Embedding worker unavailable}
    patch:
      operationId: setEmbeddingModelEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmbeddingModelActionRequest'}
      responses:
        '200':
          description: Updated local embedding model state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmbeddingModelStatus'}
        '400': {description: Invalid package state or model action}
    delete:
      operationId: deleteEmbeddingModel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteEmbeddingModelRequest'}
      responses:
        '200':
          description: Local model removed after it is disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmbeddingModelStatus'}
        '400': {description: Active model or invalid model id}
  /embedding-models/install:
    post:
      operationId: importEmbeddingModel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmbeddingModelInstallRequest'}
      responses:
        '200':
          description: Verified offline model package installed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmbeddingModelStatus'}
        '400':
          description: Invalid archive, manifest, resource hash or size
  /embedding-models/install-online:
    post:
      operationId: installCatalogEmbeddingModel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmbeddingModelOnlineInstallRequest'}
      responses:
        '200':
          description: Verified fixed-catalog model installed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmbeddingModelStatus'}
        '400': {description: Catalog resources are unavailable or failed verification}
  /embedding-models/health:
    get:
      operationId: getEmbeddingModelHealth
      parameters:
        - in: query
          name: modelId
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Local model and CPU runtime health
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmbeddingModelHealth'}
        '400': {description: Missing model id}
        '503': {description: Embedding worker unavailable}
  /skills:
    get:
      operationId: listSkills
      responses:
        '200':
          description: Installed global Agent Skills
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Skill'}}
  /skills/{skillId}:
    parameters:
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getSkill
      responses:
        '200':
          description: Skill metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Skill'}
    delete:
      operationId: deleteSkill
      responses:
        '204': {description: Deleted}
  /skills/import:
    post:
      operationId: importSkill
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportSkillRequest'}
      responses:
        '202':
          description: Skill import job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
  /skills/{skillId}/links:
    parameters:
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: updateSkillLinks
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SkillLinksRequest'}
      responses:
        '200':
          description: Updated Skill links
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Skill'}
  /skill-mapping-targets:
    get:
      operationId: listSkillMappingTargets
      responses:
        '200':
          description: External Agent or project Skill directories and mappings
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SkillMappingTarget'}}
    post:
      operationId: createSkillMappingTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSkillMappingTargetRequest'}
      responses:
        '201':
          description: Created and verified mapping target
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillMappingTarget'}
  /skill-mapping-targets/{targetId}:
    parameters:
      - in: path
        name: targetId
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateSkillMappingTarget
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSkillMappingTargetRequest'}
      responses:
        '200':
          description: Updated mapping target
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillMappingTarget'}
    delete:
      operationId: deleteSkillMappingTarget
      responses:
        '204': {description: Deleted after safe link cleanup}
  /skill-mapping-targets/{targetId}/skills:
    parameters:
      - in: path
        name: targetId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: addSkillMappings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SkillMappingIDsRequest'}
      responses:
        '200':
          description: Updated mapping target
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillMappingTarget'}
  /skill-mapping-targets/{targetId}/skills/{skillId}:
    parameters:
      - in: path
        name: targetId
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: removeSkillMapping
      responses:
        '204': {description: Removed after safe link cleanup}
  /skill-mapping-targets/{targetId}/skills/{skillId}/record:
    parameters:
      - in: path
        name: targetId
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: forgetSkillMapping
      responses:
        '204': {description: Forgotten without touching the external object}
  /skill-mapping-targets/{targetId}/verify:
    parameters:
      - in: path
        name: targetId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: verifySkillMappingTarget
      responses:
        '200':
          description: Read-only file-system verification result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillMappingTarget'}
  /skill-mapping-targets/{targetId}/skills/{skillId}/repair:
    parameters:
      - in: path
        name: targetId
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: repairSkillMapping
      responses:
        '200':
          description: Updated mapping target after repairing a missing link
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillMappingTarget'}
  /skills/{skillId}/manifest:
    parameters:
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getSkillManifest
      responses:
        '200':
          description: Standard Skill package manifest with SKILL.md content
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SkillManifest'}
  /skills/{skillId}/files/{filePath}:
    parameters:
      - in: path
        name: skillId
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: filePath
        required: true
        schema: {type: string}
    get:
      operationId: getSkillFile
      responses:
        '200':
          description: Read-only Skill file
          content:
            application/octet-stream: {}
  /imports/files:
    post:
      operationId: importFiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId, paths]
              properties:
                libraryId: {type: string, format: uuid}
                paths: {type: array, items: {type: string}}
                watchSource: {type: boolean, default: false}
      responses:
        '202':
          description: Import jobs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Job'}
  /imports/url:
    post:
      operationId: importUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId, url]
              properties:
                libraryId: {type: string, format: uuid}
                url: {type: string, format: uri}
                maxDepth: {type: integer, minimum: 0, maximum: 3, default: 0}
                maxPages: {type: integer, minimum: 1, maximum: 100, default: 1}
      responses:
        '202':
          description: Import job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
  /jobs:
    get:
      operationId: listJobs
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [queued, running, cancellation_requested, completed, failed, cancelled]}}
        - {in: query, name: kind, schema: {type: string}}
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Job'}
  /jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Queued job cancelled or cooperative cancellation requested}
        '409': {description: Job cannot be cancelled in its current state}
  /jobs/{jobId}/retry:
    post:
      operationId: retryJob
      parameters:
        - {in: path, name: jobId, required: true, schema: {type: string, format: uuid}}
      responses:
        '202': {description: New job created with originJobId retaining the original record}
        '409': {description: Only failed or cancelled jobs can be retried}
  /folders:
    get:
      operationId: listFolders
      parameters:
        - {in: query, name: libraryId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Virtual folders
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/VirtualFolder'}}
    post:
      operationId: createFolder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFolderRequest'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VirtualFolder'}
  /folders/{folderId}:
    patch:
      operationId: updateFolder
      parameters:
        - {in: path, name: folderId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                parentId: {type: string}
      responses:
        '200': {description: Renamed or moved folder}
        '400': {description: Cross-library parent or hierarchy cycle}
    delete:
      operationId: deleteFolder
      parameters:
        - {in: path, name: folderId, required: true, schema: {type: string}}
      responses:
        '204': {description: Folder removed; document memberships are unassigned but documents are retained}
  /documents/batch:
    post:
      operationId: batchDocuments
      description: Transactional batch operation. Every document must exist and belong to one library, otherwise nothing is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentBatchRequest'}
      responses:
        '200':
          description: Batch applied atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentBatchResult'}
        '400': {description: 'Invalid IDs, cross-library selection, or unsupported action'}
  /documents/{documentId}/reindex:
    post:
      operationId: reindexDocument
      parameters:
        - {in: path, name: documentId, required: true, schema: {type: string, format: uuid}}
      responses:
        '202': {description: Reindex job queued}
  /documents/{documentId}/relink:
    post:
      operationId: relinkDocumentSource
      parameters:
        - {in: path, name: documentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourcePath]
              properties:
                sourcePath: {type: string}
      responses:
        '200': {description: Source relocated and document reparsed}
  /documents/{documentId}/folders/{folderId}:
    put:
      operationId: assignDocumentFolder
      parameters:
        - {in: path, name: documentId, required: true, schema: {type: string}}
        - {in: path, name: folderId, required: true, schema: {type: string}}
      responses:
        '204': {description: Assigned}
    delete:
      operationId: removeDocumentFolder
      parameters:
        - {in: path, name: documentId, required: true, schema: {type: string}}
        - {in: path, name: folderId, required: true, schema: {type: string}}
      responses:
        '204': {description: Removed}
  /sources/watches:
    get:
      operationId: listSourceWatches
      parameters:
        - {in: query, name: libraryId, required: true, schema: {type: string}}
      responses:
        '200':
          description: Source watches
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SourceWatch'}}
    post:
      operationId: createSourceWatch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSourceWatchRequest'}
      responses:
        '202': {description: Scan queued}
  /sources/watches/{watchId}:
    patch:
      operationId: updateSourceWatch
      parameters:
        - {in: path, name: watchId, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                recursive: {type: boolean}
      responses:
        '200': {description: Watch pause/recursive settings updated}
    delete:
      operationId: deleteSourceWatch
      parameters:
        - {in: path, name: watchId, required: true, schema: {type: string}}
      responses:
        '204': {description: Deleted}
  /sources/watches/{watchId}/scan:
    post:
      operationId: scanSourceWatch
      parameters:
        - {in: path, name: watchId, required: true, schema: {type: string}}
      responses:
        '202': {description: Scan queued}
  /indexes/rebuild:
    post:
      operationId: rebuildIndex
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RebuildIndexRequest'}
      responses:
        '202': {description: Rebuild queued}
  /retrieval/search:
    post:
      operationId: searchUnifiedRetrieval
      description: Scope-checked retrieval over stable knowledge, raw source chunks, and project architecture evidence. Answer generation is not performed here.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetrievalSearchRequest'}
      responses:
        '200':
          description: Unified retrieval results with source and model/degradation metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetrievalSearchResponse'}
        '403': {description: Library or project scope denied}
  /query:
    post:
      operationId: queryDesktopKnowledge
      description: Desktop citation search and optional answer generation. Retrieval uses the same unified service as MCP evidence_search; answer generation is a separate configured provider step.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryRequest'}
      responses:
        '200':
          description: Unified citations with source, review, and degradation metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryResponse'}
        '403': {description: Library or project scope denied}
  /query/stream:
    post:
      operationId: streamDesktopKnowledgeQuery
      description: Streaming form of the desktop query endpoint. Retrieval events use the same unified citation service; answer generation remains optional.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryRequest'}
      responses:
        '200':
          description: Server-sent retrieval, citation, answer, and complete events
          content:
            text/event-stream: {schema: {type: string}}
  /retrieval/index/rebuild:
    post:
      operationId: rebuildUnifiedRetrievalIndex
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetrievalRebuildRequest'}
      responses:
        '200':
          description: Validated generations switched atomically per library
          content:
            application/json:
              schema:
                type: object
                required: [generations]
                properties:
                  generations: {type: array, items: {$ref: '#/components/schemas/RetrievalGeneration'}}
  /retrieval/index:
    get:
      operationId: getUnifiedRetrievalIndex
      parameters:
        - {in: query, name: libraryId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Active retrieval generation metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetrievalGeneration'}
  /retrieval/index/progress:
    get:
      operationId: getUnifiedRetrievalIndexProgress
      parameters:
        - {in: query, name: libraryId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Rebuild progress
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetrievalProgress'}
  /retrieval/index/cancel:
    post:
      operationId: cancelUnifiedRetrievalIndex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId]
              properties:
                libraryId: {type: string, format: uuid}
      responses:
        '200': {description: Cancellation requested; the active generation remains serving}
  /saved-searches:
    get:
      operationId: listSavedSearches
      responses:
        '200':
          description: Saved searches
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SavedSearch'}
    post:
      operationId: createSavedSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedSearch'}
      responses:
        '201':
          description: Created saved search
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedSearch'}
  /saved-searches/{savedSearchId}:
    patch:
      operationId: updateSavedSearch
      parameters:
        - in: path
          name: savedSearchId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SavedSearch'}
      responses:
        '200': {description: 'Full query, view, filters, and sort updated'}
    delete:
      operationId: deleteSavedSearch
      parameters:
        - in: path
          name: savedSearchId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Deleted}

  /graph:
    get:
      operationId: getRelationshipGraph
      parameters:
        - in: query
          name: libraryId
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: workspaceId
          schema: {type: string, format: uuid}
        - in: query
          name: centerNodeId
          schema: {type: string}
        - in: query
          name: depth
          schema: {type: integer, minimum: 1, maximum: 2, default: 1}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 300, default: 250}
      responses:
        '200':
          description: Stable knowledge relationship graph scoped to one library
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphSnapshot'}
  /graph/workspaces:
    post:
      operationId: createGraphWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId]
              properties:
                libraryId: {type: string, format: uuid}
                name: {type: string, maxLength: 120, default: 默认图谱}
      responses:
        '201':
          description: Created graph workspace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphWorkspace'}
  /graph/workspaces/{workspaceId}:
    parameters:
      - in: path
        name: workspaceId
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updateGraphWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateGraphWorkspaceRequest'}
      responses:
        '200':
          description: Updated graph workspace
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphWorkspace'}
  /graph/workspaces/{workspaceId}/positions:
    parameters:
      - in: path
        name: workspaceId
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: saveGraphPositions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positions]
              properties:
                positions:
                  type: array
                  maxItems: 300
                  items: {$ref: '#/components/schemas/GraphPositionUpdate'}
      responses:
        '200':
          description: Atomically saved normalized fractional percentage positions
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items: {$ref: '#/components/schemas/GraphPositionUpdate'}
  /graph/workspaces/{workspaceId}/auto-layout:
    parameters:
      - in: path
        name: workspaceId
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: autoLayoutGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId]
              properties:
                libraryId: {type: string, format: uuid}
                overwrite: {type: boolean, default: false}
      responses:
        '200':
          description: Deterministic percentage positions for missing or all visible nodes
          content:
            application/json:
              schema:
                type: object
                required: [positions]
                properties:
                  positions:
                    type: array
                    items: {$ref: '#/components/schemas/GraphPositionUpdate'}

  /knowledge/search:
    post:
      operationId: searchKnowledge
      description: Desktop-only KAH directory search. Agents must use knowledge_search through Read MCP.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KnowledgeSearchRequest'}
      responses:
        '200':
          description: Relevant stable knowledge directory entries, without full body text.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeSearchResponse'}
  /knowledge/resolve:
    get:
      operationId: resolveKnowledge
      parameters:
        - in: query
          name: uri
          required: true
          schema: {type: string, format: uri}
      responses:
        '200':
          description: A stable or explicitly revision-pinned KAH knowledge payload.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Knowledge'}
  /knowledge/submissions:
    get:
      operationId: listKAHKnowledgeSubmissions
      parameters:
        - in: query
          name: libraryId
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: KAH draft submissions visible to the desktop session.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/KAHSubmission'}}
    post:
      operationId: createDesktopKnowledgeSubmission
      description: Creates an immutable revision draft from the current stable revision. A stale baseRevision returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DesktopKnowledgeSubmissionRequest'}
      responses:
        '201': {description: Revision draft created}
        '409': {description: Stable base revision changed or client idempotency ID conflicts}
  /knowledge/submissions/{submissionId}:
    parameters:
      - in: path
        name: submissionId
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getKAHKnowledgeSubmission
      responses:
        '200':
          description: KAH submission, validation outcome, review history, and normalized Markdown.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KAHSubmission'}
  /knowledge/submissions/{submissionId}/approve:
    post:
      operationId: approveKAHKnowledgeSubmission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecisionRequest'}
      responses:
        '200':
          description: Approved and atomically published KAH revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Knowledge'}
  /knowledge/submissions/{submissionId}/reject:
    post:
      operationId: rejectKAHKnowledgeSubmission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewDecisionRequest'}
      responses:
        '200':
          description: Submission rejected and retained for audit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KAHSubmission'}

  /tokens:
    get:
      operationId: listTokens
      responses:
        '200':
          description: Agent tokens
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AgentToken'} }
    post:
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: {type: string}
                scopes: {type: array, minItems: 1, uniqueItems: true, items: {enum: [mcp_read, mcp_manage, evidence_search, evidence_read]}}
                libraryIds: {type: array, items: {type: string, format: uuid}}
                projectIds: {type: array, items: {type: string, format: uuid}, description: Explicit project grants for architecture evidence; library grants do not imply project access}
      responses:
        '201':
          description: Token, including the one-time plaintext secret
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToken'}
  /providers:
    get:
      operationId: listProviders
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Provider'} }
    post:
      operationId: saveProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Provider'}
      responses:
        '200':
          description: Saved provider
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Provider'}
  /providers/{providerId}/models:
    get:
      operationId: listProviderModels
      parameters:
        - in: path
          name: providerId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Available provider models
          content:
            application/json:
              schema: {type: object, required: [models], properties: {models: {type: array, items: {type: string}}}}
  /providers/{providerId}:
    delete:
      operationId: deleteProvider
      parameters:
        - {in: path, name: providerId, required: true, schema: {type: string}}
      responses:
        '204': {description: Provider deleted}
        '409': {description: Provider is referenced by one or more library automation settings}
  /providers/{providerId}/test:
    post:
      operationId: testProvider
      parameters:
        - {in: path, name: providerId, required: true, schema: {type: string}}
      responses:
        '200': {description: Connection succeeded and available models returned}
  /trash:
    get:
      operationId: listTrash
      responses:
        '200': {description: Trashed libraries and documents}
    delete:
      operationId: emptyTrash
      responses:
        '204': {description: All trashed records and unreferenced object files permanently removed}
  /trash/{kind}/{id}/restore:
    post:
      operationId: restoreTrashItem
      parameters:
        - {in: path, name: kind, required: true, schema: {enum: [library, document]}}
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Restored; library source watches remain paused}
  /trash/{kind}/{id}:
    delete:
      operationId: purgeTrashItem
      parameters:
        - {in: path, name: kind, required: true, schema: {enum: [library, document]}}
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Permanently removed after object reference check}
  /audit:
    get:
      operationId: listAudit
      responses:
        '200':
          description: Recent local audit entries
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}
  /backups:
    get:
      operationId: listBackups
      responses:
        '200':
          description: Existing local backup artifacts, newest first
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/BackupRecord'}}
    post:
      operationId: createBackup
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                includeIndexes: {type: boolean, default: true}
      responses:
        '201':
          description: Backup artifact
          content:
            application/json:
              schema: {type: object, properties: {path: {type: string}, sha256: {type: string}}}
  /backups/verify:
    post:
      operationId: verifyBackup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string}
      responses:
        '200': {description: Backup checksum and manifest are valid}
        '400': {description: 'Backup is missing, corrupt, or incompatible'}
  /projects:
    get:
      operationId: listArchitectureProjects
      parameters:
        - {in: query, name: libraryId, schema: {type: string}}
      responses:
        '200':
          description: Desktop architecture projects
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ArchitectureProject'}}}}
    post:
      operationId: createArchitectureProject
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateArchitectureProjectRequest'}}}
      responses:
        '201': {description: Created project, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureProject'}}}}
  /projects/{projectId}:
    parameters: [{in: path, name: projectId, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getArchitectureProject
      responses: {'200': {description: Project, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureProject'}}}}}
    patch:
      operationId: updateArchitectureProject
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateArchitectureProjectRequest'}}}}
      responses: {'200': {description: Updated project, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureProject'}}}}}
    delete:
      operationId: deleteArchitectureProject
      responses: {'204': {description: Project moved to trash}}
  /projects/{projectId}/scan:
    post:
      operationId: scanArchitectureProject
      parameters: [{in: path, name: projectId, required: true, schema: {type: string, format: uuid}}]
      responses: {'202': {description: Queued scan task, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureTask'}}}}}
  /projects/{projectId}/generate:
    post:
      operationId: generateArchitectureProject
      parameters: [{in: path, name: projectId, required: true, schema: {type: string, format: uuid}}]
      responses: {'202': {description: Queued architecture generation task, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureTask'}}}}}
  /projects/{projectId}/tasks:
    get:
      operationId: listArchitectureTasks
      parameters: [{in: path, name: projectId, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Tasks, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ArchitectureTask'}}}}}}
  /projects/{projectId}/snapshots:
    get:
      operationId: listArchitectureSnapshots
      parameters: [{in: path, name: projectId, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Immutable snapshots, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ArchitectureSnapshot'}}}}}}
  /projects/{projectId}/snapshots/{snapshotId}:
    get:
      operationId: getArchitectureSnapshot
      parameters:
        - {in: path, name: projectId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: snapshotId, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Snapshot metadata and inventory, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureSnapshot'}}}}}
  /projects/{projectId}/snapshots/{snapshotId}/analysis:
    parameters:
      - {in: path, name: projectId, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: snapshotId, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getArchitectureAnalysis
      responses: {'200': {description: Validated architecture analysis, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureAnalysis'}}}}}
    post:
      operationId: saveArchitectureAnalysis
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureAnalysis'}}}}
      responses: {'201': {description: Saved analysis, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureAnalysis'}}}}}
  /projects/{projectId}/snapshots/{snapshotId}/artifacts:
    get:
      operationId: listArchitectureArtifacts
      parameters:
        - {in: path, name: projectId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: snapshotId, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Generated architecture artifacts, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ArchitectureArtifact'}}}}}}
  /projects/{projectId}/snapshots/{snapshotId}/artifacts/{kind}:
    get:
      operationId: downloadArchitectureArtifact
      parameters:
        - {in: path, name: projectId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: snapshotId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: kind, required: true, schema: {type: string, enum: [document, diagram_json, html, svg, png]}}
      responses: {'200': {description: Artifact bytes}}
  /projects/{projectId}/versions/{snapshotId}/diff:
    get:
      operationId: getArchitectureDiff
      parameters:
        - {in: path, name: projectId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: snapshotId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: fromSnapshotId, schema: {type: string, format: uuid}}
      responses: {'200': {description: Snapshot file and validated analysis diff, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureDiff'}}}}}
  /architecture-tasks/{taskId}/cancel:
    post:
      operationId: cancelArchitectureTask
      parameters: [{in: path, name: taskId, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Cancelled task, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureTask'}}}}}
  /architecture/agents:
    post:
      operationId: registerArchitectureAgent
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureAgentRegistration'}}}}
      responses: {'201': {description: Agent credential, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureAgentCredential'}}}}}
    get:
      operationId: listArchitectureAgents
      responses: {'200': {description: Registered agents, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ArchitectureAgent'}}}}}}
  /architecture/agent/tasks/claim:
    post:
      security: [{architectureAgentAuth: []}]
      operationId: claimArchitectureAgentTask
      responses: {'200': {description: Claimed task, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureAgentLease'}}}}, '204': {description: No queued task}}
  /architecture/agent/tasks/heartbeat:
    post:
      security: [{architectureAgentAuth: []}]
      operationId: heartbeatArchitectureAgentTask
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureAgentHeartbeat'}}}}
      responses: {'204': {description: Lease renewed}}
  /architecture/agent/tasks/result:
    post:
      security: [{architectureAgentAuth: []}]
      operationId: submitArchitectureAgentResult
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureAgentResult'}}}}
      responses: {'200': {description: Result accepted, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureTask'}}}}}
  /architecture/agent/tasks/failure:
    post:
      security: [{architectureAgentAuth: []}]
      operationId: submitArchitectureAgentFailure
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureAgentFailure'}}}}
      responses: {'200': {description: Failure recorded, content: {application/json: {schema: {$ref: '#/components/schemas/ArchitectureTask'}}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    architectureAgentAuth: {type: http, scheme: bearer, description: Dedicated architecture agent secret; not interchangeable with MCP tokens}
  schemas:
    ArchitectureExecution:
      type: object
      required: [executor, allowExternal, timeoutSeconds]
      properties:
        providerId: {type: string}
        executor: {type: string, enum: [none, auto, codex, mcp, provider]}
        codexPath: {type: string}
        codexModel: {type: string}
        allowExternal: {type: boolean}
        timeoutSeconds: {type: integer, minimum: 0, maximum: 86400}
    ArchitectureProject:
      type: object
      required: [id, libraryId, name, rootPath, excludePatterns, scanPeriodSeconds, allowRemoteCode, execution, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        libraryId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 4000}
        rootPath: {type: string}
        excludePatterns: {type: array, items: {type: string}, maxItems: 200}
        scanPeriodSeconds: {type: integer, minimum: 0, maximum: 31536000}
        scheduleKind: {type: string, enum: [manual, daily, weekly, interval]}
        scheduleAnchor: {type: string, format: date-time}
        scheduleNextAt: {type: string, format: date-time}
        allowRemoteCode: {type: boolean, description: Remote code execution policy for later stages}
        execution: {$ref: '#/components/schemas/ArchitectureExecution'}
        lastSnapshotId: {type: string, format: uuid}
        lastSnapshotHash: {type: string}
        lastScanChanged: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateArchitectureProjectRequest:
      type: object
      required: [libraryId, name, rootPath]
      properties:
        libraryId: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 4000}
        rootPath: {type: string}
        excludePatterns: {type: array, items: {type: string}, maxItems: 200}
        scanPeriodSeconds: {type: integer, minimum: 0, maximum: 31536000}
        scheduleKind: {type: string, enum: [manual, daily, weekly, interval], default: manual}
        scheduleAnchor: {type: string, format: date-time}
        allowRemoteCode: {type: boolean, default: false}
        execution: {$ref: '#/components/schemas/ArchitectureExecution'}
    UpdateArchitectureProjectRequest:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 4000}
        rootPath: {type: string}
        excludePatterns: {type: array, items: {type: string}, maxItems: 200}
        scanPeriodSeconds: {type: integer, minimum: 0, maximum: 31536000}
        scheduleKind: {type: string, enum: [manual, daily, weekly, interval]}
        scheduleAnchor: {type: string, format: date-time}
        allowRemoteCode: {type: boolean}
        execution: {$ref: '#/components/schemas/ArchitectureExecution'}
    ArchitectureCoverage:
      type: object
      additionalProperties: true
    ArchitectureFile:
      type: object
      required: [path, language, size, lineStart, lineEnd, lineCount, contentHash, entryPoint]
      properties:
        path: {type: string}
        language: {type: string}
        size: {type: integer, minimum: 0}
        lineStart: {type: integer, minimum: 1}
        lineEnd: {type: integer, minimum: 0}
        lineCount: {type: integer, minimum: 0}
        contentHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        gitStatus: {type: string}
        entryPoint: {type: boolean}
        dependencyFiles: {type: array, items: {type: string}}
        containerFiles: {type: array, items: {type: string}}
        detection: {type: string}
    ArchitectureModule:
      type: object
      required: [name, language, rootPath, dependencies, entryPoints, dependencyFiles, containerFiles, unknown, evidencePaths]
      properties:
        name: {type: string}
        language: {type: string}
        rootPath: {type: string}
        version: {type: string}
        dependencies: {type: array, items: {type: string}}
        dependencyVersions: {type: object, additionalProperties: {type: string}}
        entryPoints: {type: array, items: {type: string}}
        dependencyFiles: {type: array, items: {type: string}}
        containerFiles: {type: array, items: {type: string}}
        unknown: {type: boolean}
        evidencePaths: {type: array, items: {type: string}}
    ArchitectureSnapshot:
      type: object
      required: [id, projectId, generation, status, contentHash, gitDirty, gitChangedPaths, fileCount, moduleCount, unknownCount, coverage, files, modules, createdAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        generation: {type: integer, minimum: 1}
        status: {type: string, enum: [complete, unchanged]}
        contentHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        gitRevision: {type: string}
        gitDirty: {type: boolean}
        gitChangedPaths: {type: array, items: {type: string}}
        fileCount: {type: integer, minimum: 0}
        moduleCount: {type: integer, minimum: 0}
        unknownCount: {type: integer, minimum: 0}
        coverage: {$ref: '#/components/schemas/ArchitectureCoverage'}
        files: {type: array, items: {$ref: '#/components/schemas/ArchitectureFile'}}
        modules: {type: array, items: {$ref: '#/components/schemas/ArchitectureModule'}}
        createdAt: {type: string, format: date-time}
    ArchitectureTask:
      type: object
      required: [id, projectId, kind, status, generation, cancelRequested, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        kind: {type: string, enum: [scan, analysis, mcp]}
        status: {type: string, enum: [queued, running, cancellation_requested, completed, failed, cancelled]}
        generation: {type: integer, minimum: 1}
        input: {$ref: '#/components/schemas/ArchitectureAnalysisRequest'}
        snapshotId: {type: string, format: uuid}
        cancelRequested: {type: boolean}
        errorCode: {type: string}
        message: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ArchitectureArtifact:
      type: object
      required: [id, projectId, snapshotId, kind, fileName, contentType, relativePath, contentHash, size, createdAt]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        snapshotId: {type: string, format: uuid}
        kind: {type: string, enum: [document, diagram_json, html, svg, png]}
        fileName: {type: string}
        contentType: {type: string}
        renderer: {type: string, description: Producer identifier; fallback renderers are explicit.}
        rendererError: {type: string, description: Non-empty when the producer degraded or reported a health issue.}
        relativePath: {type: string}
        contentHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        size: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    ArchitectureAnalysis:
      type: object
      required: [schemaVersion, projectId, snapshotId, facts, inferences, evidence, incremental, coverage]
      properties:
        schemaVersion: {type: string, const: kah.architecture.analysis.v1}
        projectId: {type: string, format: uuid}
        snapshotId: {type: string, format: uuid}
        facts: {type: array, items: {type: object}}
