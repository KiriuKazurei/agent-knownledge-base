name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.21.0}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e ".\services\worker[dev,index]"
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: go test ./...
        working-directory: services/api
      - run: python -m pytest services/worker/tests
      - run: pnpm exec spectral lint contracts/openapi.yaml

